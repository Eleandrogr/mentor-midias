<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/base.css">
<style>
  .fonte-n { color: var(--muted-dark); border-top: 1px solid rgba(245,246,250,.18); padding-top: 22px; }
  .fonte-c { color: var(--muted-light); border-top: 1px solid rgba(30,39,46,.14); padding-top: 22px; }
  .fonte-b { color: #FFFFFF; opacity: .9; border-top: 1px solid rgba(255,255,255,.28); padding-top: 22px; }
  .fonte-n, .fonte-c, .fonte-b { font-size: 24px; }
  .ponto { color: var(--blue); }
  .marcador { display: inline-block; width: 22px; height: 22px; border-radius: 4px; background: var(--night); margin-right: 16px; vertical-align: -2px; }
  .topo { margin-top: 130px; }
  @media (min-height: 1700px) { .grafico { margin-top: 96px !important; } }  /* área segura do Reels: marca/base.css */

  .titulo { font-size: 76px; margin-top: 64px; max-width: 904px; }
  .apoio { color: var(--muted-dark); margin-top: 20px; max-width: 860px; font-size: 30px; }
  .grafico { margin-top: 56px; display: flex; flex-direction: column; gap: 26px; }
  .linha { display: grid; grid-template-columns: 160px 1fr 170px; align-items: center; gap: 20px; }
  .rotulo { font-size: 28px; color: var(--cloud); }
  .trilho { height: 44px; position: relative; }
  .barra { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: #46535E; min-width: 4px; }
  .barra.destaque { background: var(--cyan); }
  .valor { font: 500 32px "Geist Mono", monospace; color: var(--muted-dark); text-align: right; font-variant-numeric: tabular-nums; }
  .valor.destaque { color: var(--cyan); }
  .grafico { margin-top: 88px; gap: 56px; }
  .linha { grid-template-columns: 1fr; gap: 16px; }
  .linha .cab { display: flex; justify-content: space-between; align-items: baseline; }
  .rotulo { font-size: 36px; }
  .trilho { height: 120px; }
  .valor { font-size: 72px; text-align: right; }
  .grafico { margin-top: 48px; gap: 24px; }
  .trilho { height: 56px; }
  .valor { font-size: 52px; }
  .rotulo { font-size: 32px; }</style></head>
<body><div class="peca night">
  <img class="logo" src="marca/logos/mentor-logo-escuro.svg" alt="Mentor" data-in="0">
  <div class="display titulo" data-in="0.3">Reserva subiu desde 2019</div>
  <p class="apoio" data-in="0.7">% das MPEs paulistas que fizeram reservas para pagar o 13º</p>
  <div class="grafico">
    <div class="linha" data-in="1.0"><div class="cab"><span class="rotulo">2019</span><span class="valor" data-in="1.1" data-count="37.4" data-decimals="1" data-prefix="" data-suffix="%">37,4%</span></div><div class="trilho"><div class="barra" style="width:70.0%" data-growx="1.1"></div></div></div>
    <div class="linha" data-in="1.2"><div class="cab"><span class="rotulo">2022</span><span class="valor" data-in="1.3" data-count="45.1" data-decimals="1" data-prefix="" data-suffix="%">45,1%</span></div><div class="trilho"><div class="barra" style="width:84.5%" data-growx="1.3"></div></div></div>
    <div class="linha" data-in="1.4"><div class="cab"><span class="rotulo">2023</span><span class="valor" data-in="1.5" data-count="44.7" data-decimals="1" data-prefix="" data-suffix="%">44,7%</span></div><div class="trilho"><div class="barra" style="width:83.7%" data-growx="1.5"></div></div></div>
    <div class="linha" data-in="1.6"><div class="cab"><span class="rotulo">2024</span><span class="valor destaque" data-in="1.7" data-count="53.4" data-decimals="1" data-prefix="" data-suffix="%">53,4%</span></div><div class="trilho"><div class="barra destaque" style="width:100.0%" data-growx="1.7"></div></div></div>
  </div>
  <div class="spacer"></div>
  <p class="fonte-n" data-in="2.2">Fonte: Sebrae-SP e Fundação Seade, Indicadores Sebrae-SP, MPEs e o 13º salário (2024)</p>
</div></body></html>

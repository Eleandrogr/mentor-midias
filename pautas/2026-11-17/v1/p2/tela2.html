<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/base.css">
<style>
  .fonte-n { color: var(--muted-dark); border-top: 1px solid rgba(245,246,250,.18); padding-top: 22px; }
  .fonte-c { color: var(--muted-light); border-top: 1px solid rgba(30,39,46,.14); padding-top: 22px; }
  .fonte-b { color: #FFFFFF; opacity: .9; border-top: 1px solid rgba(255,255,255,.28); padding-top: 22px; }
  .fonte-n, .fonte-c, .fonte-b { font-size: 24px; }
  .ponto { color: var(--blue); }
  .marcador { display: inline-block; width: 22px; height: 22px; border-radius: 4px; background: var(--night); margin-right: 16px; vertical-align: -2px; }
  .topo { margin-top: 130px; }
  @media (min-height: 1700px) { .grafico { margin-top: 96px !important; } }  /* área segura do Reels: marca/base.css */

  .titulo { font-size: 76px; margin-top: 64px; max-width: 904px; }
  .apoio { color: var(--muted-dark); margin-top: 20px; max-width: 860px; font-size: 30px; }
  .grafico { margin-top: 56px; display: flex; flex-direction: column; gap: 34px; }
  .linha { display: grid; grid-template-columns: 110px 1fr 230px; align-items: center; gap: 20px; }
  .rotulo { font-size: 34px; color: var(--cloud); }
  .trilho { height: 60px; position: relative; }
  .barra { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: #46535E; min-width: 4px; }
  .barra.destaque { background: var(--cyan); }
  .valor { font: 500 38px "Geist Mono", monospace; color: var(--muted-dark); text-align: right; font-variant-numeric: tabular-nums; }
  .valor.destaque { color: var(--cyan); }</style></head>
<body><div class="peca night">
  <img class="logo" src="marca/logos/mentor-logo-escuro.svg" alt="Mentor" data-in="0">
  <div class="display titulo" data-in="0.3">R$ 32.400 em dezembro</div>
  <p class="apoio" data-in="0.7">Reserva acumulada (13º + FGTS) de uma folha de R$ 30 mil por mês, exemplo, em R$</p>
  <div class="grafico">
    <div class="linha" data-in="1.0"><span class="rotulo">Fev</span><div class="trilho"><div class="barra" style="width:16.7%" data-growx="1.1"></div></div><span class="valor" data-in="1.1" data-count="5400" data-decimals="0" data-prefix="R$ " data-suffix="">R$ 5.400</span></div>
    <div class="linha" data-in="1.2"><span class="rotulo">Abr</span><div class="trilho"><div class="barra" style="width:33.3%" data-growx="1.3"></div></div><span class="valor" data-in="1.3" data-count="10800" data-decimals="0" data-prefix="R$ " data-suffix="">R$ 10.800</span></div>
    <div class="linha" data-in="1.4"><span class="rotulo">Jun</span><div class="trilho"><div class="barra" style="width:50.0%" data-growx="1.5"></div></div><span class="valor" data-in="1.5" data-count="16200" data-decimals="0" data-prefix="R$ " data-suffix="">R$ 16.200</span></div>
    <div class="linha" data-in="1.6"><span class="rotulo">Ago</span><div class="trilho"><div class="barra" style="width:66.7%" data-growx="1.7"></div></div><span class="valor" data-in="1.7" data-count="21600" data-decimals="0" data-prefix="R$ " data-suffix="">R$ 21.600</span></div>
    <div class="linha" data-in="1.8"><span class="rotulo">Out</span><div class="trilho"><div class="barra" style="width:83.3%" data-growx="1.9"></div></div><span class="valor" data-in="1.9" data-count="27000" data-decimals="0" data-prefix="R$ " data-suffix="">R$ 27.000</span></div>
    <div class="linha" data-in="2.0"><span class="rotulo">Dez</span><div class="trilho"><div class="barra destaque" style="width:100.0%" data-growx="2.1"></div></div><span class="valor destaque" data-in="2.1" data-count="32400" data-decimals="0" data-prefix="R$ " data-suffix="">R$ 32.400</span></div>
  </div>
  <div class="spacer"></div>
  <p class="fonte-n" data-in="2.6">Cálculo ilustrativo pela Lei 4.090/1962 (1/12 por mês) e Lei 8.036/1990 (FGTS de 8%)</p>
</div></body></html>

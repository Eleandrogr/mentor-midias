<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/reel.css">
<style>.cal{display:flex;flex-direction:column;gap:30px;margin-top:52px}.row{display:grid;grid-template-columns:90px 1fr;gap:20px;align-items:center}
.row .c{font:800 64px "Saira";line-height:1}.m{display:grid;grid-template-columns:repeat(12,1fr);gap:8px}.m i{height:58px;border-radius:8px;background:rgba(255,255,255,.22)}
.m i.on{background:var(--night)}.ms{display:grid;grid-template-columns:90px 1fr;gap:20px;font-size:26px;margin-top:6px}.ms div{display:flex;justify-content:space-between}
.leg{font-size:38px;line-height:1.4;margin-top:36px}</style></head><body>
<section class="cena blue" data-dur="6" data-camera="aproxima"><div class="camera" style="justify-content:space-between">
  <img class="logo" src="marca/logos/mentor-logo-sobre-azul.svg" data-in="-1" style="align-self:flex-start">
  <div>
    <div class="t2" style="font-size:96px" data-palavras data-in="-1.2" data-ritmo="0.1">O calendário que eu usaria</div>
    <div class="cal">
      <div class="row" data-in="-0.3"><span class="c">A</span><div class="m"><i class="on" data-grow="0.55"></i><i class="on" data-grow="0.6"></i><i class="on" data-grow="0.65"></i><i class="on" data-grow="0.7"></i><i class="on" data-grow="0.75"></i><i class="on" data-grow="0.8"></i><i class="on" data-grow="0.85"></i><i class="on" data-grow="0.9"></i><i class="on" data-grow="0.95"></i><i class="on" data-grow="1.0"></i><i class="on" data-grow="1.05"></i><i class="on" data-grow="1.1"></i></div></div>
      <div class="row" data-in="1.3"><span class="c">B</span><div class="m"><i class="on" data-grow="1.4"></i><i></i><i></i><i class="on" data-grow="1.5"></i><i></i><i></i><i class="on" data-grow="1.6"></i><i></i><i></i><i class="on" data-grow="1.7"></i><i></i><i></i></div></div>
      <div class="row" data-in="1.9"><span class="c">C</span><div class="m"><i class="on" data-grow="2.0"></i><i></i><i></i><i></i><i></i><i></i><i class="on" data-grow="2.1"></i><i></i><i></i><i></i><i></i><i></i></div></div>
      <div class="ms mono" data-in="-0.3"><span></span><div><span>jan</span><span>dez</span></div></div>
    </div>
    <p class="leg" data-in="2.4"><b class="mono">A</b> todo mês · <b class="mono">B</b> a cada 3 meses · <b class="mono">C</b> a cada 6 meses</p>
  </div>
  <p class="fn" style="margin:0;color:rgba(255,255,255,.88)" data-in="2.6">Frequências de exemplo: ajuste ao seu giro.</p>
</div></section></body></html>

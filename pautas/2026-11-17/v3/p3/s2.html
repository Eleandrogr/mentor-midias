<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/reel.css">
<style>.g{display:flex;flex-direction:column;gap:34px;margin-top:52px}.gb{display:grid;grid-template-columns:110px 1fr;gap:22px;align-items:center}
.gb .c{font:800 72px "Saira";line-height:1}.duas{display:flex;flex-direction:column;gap:10px}.lin{display:grid;grid-template-columns:1fr 270px;gap:16px;align-items:center;font-size:32px;white-space:nowrap}
.tr{height:44px;position:relative;background:rgba(245,246,250,.06);border-radius:8px}.tr i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:#46535E}.tr i.d{background:var(--cyan)}</style></head><body>
<section class="cena night" data-dur="6" data-camera="aproxima"><div class="camera" style="justify-content:space-between">
  <img class="logo" src="marca/logos/mentor-logo-escuro.svg" data-in="-1" style="align-self:flex-start">
  <div>
    <div class="t2" style="font-size:96px" data-palavras data-in="-0.4" data-ritmo="0.1">Poucos itens, quase todo o dinheiro</div>
    <div class="g mono">
      <div class="gb" data-in="0.6"><span class="c acc">A</span><div class="duas">
        <div class="lin"><div class="tr"><i class="d" style="width:80%" data-growx="0.7"></i></div><span>80% do valor</span></div>
        <div class="lin"><div class="tr"><i style="width:20%" data-growx="0.8"></i></div><span>20% dos itens</span></div></div></div>
      <div class="gb" data-in="1.1"><span class="c">B</span><div class="duas">
        <div class="lin"><div class="tr"><i style="width:15%" data-growx="1.2"></i></div><span>15% do valor</span></div>
        <div class="lin"><div class="tr"><i style="width:30%" data-growx="1.3"></i></div><span>30% dos itens</span></div></div></div>
      <div class="gb" data-in="1.6"><span class="c">C</span><div class="duas">
        <div class="lin"><div class="tr"><i style="width:5%" data-growx="1.7"></i></div><span>5% do valor</span></div>
        <div class="lin"><div class="tr"><i style="width:50%" data-growx="1.8"></i></div><span>50% dos itens</span></div></div></div>
    </div>
    <p class="ap" style="font-size:40px;color:var(--muted-dark)" data-in="2.6">Na prática: conte primeiro o que pesa no caixa.</p>
  </div>
  <p class="fn" style="margin:0" data-in="2.2">Exemplo pela regra de Pareto. Confira com os seus números.</p>
</div></section></body></html>

<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/reel.css">
<style>
.parc{margin-top:48px}
.parc .lb{display:flex;justify-content:space-between;font-size:38px;margin-bottom:14px}
.parc .bar{height:120px;border-radius:14px;background:rgba(245,246,250,.14);position:relative;overflow:hidden}
.parc .bar i{position:absolute;inset:0 auto 0 0;width:100%;background:rgba(245,246,250,.32);border-radius:14px}
.parc .bar b{position:absolute;inset:0 0 0 auto;width:2%;background:var(--cyan)}
.multa{display:flex;align-items:center;gap:22px;margin-top:22px;font-size:40px}
.multa .sw{width:34px;height:34px;border-radius:8px;background:var(--cyan)}
.multa strong{color:var(--cyan);font-weight:700}
</style></head><body>
<section class="cena night" data-dur="5.5" data-camera="aproxima"><div class="camera" style="justify-content:space-between">
  <img class="logo" src="marca/logos/mentor-logo-escuro.svg" data-in="-1" style="align-self:flex-start">
  <div>
    <div class="t2" style="font-size:90px" data-palavras data-in="-1.4" data-ritmo="0.08">Vendeu parcelado ao consumidor? Multa de até 2%</div>
    <div class="parc mono" data-in="-0.3">
      <div class="lb"><span>Parcela de exemplo</span><span>R$ 500</span></div>
      <div class="bar"><i data-growx="0.1" data-dur="0.9"></i><b data-in="1.0" data-pulsa="1.6" data-som="impacto"></b></div>
    </div>
    <div class="multa" data-in="1.1" data-from="left"><span class="sw"></span><span>Multa máxima: <strong>R$ 10</strong></span></div>
    <p class="ap" style="font-size:40px;margin-top:26px" data-in="1.8">Na prática: confira o boleto que você emite.</p>
  </div>
  <p class="fn" style="margin:0" data-in="2.2">Fonte: CDC (Lei 8.078/1990), art. 52, §1º (Câmara dos Deputados)</p>
</div></section></body></html>

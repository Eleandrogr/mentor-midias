<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/base.css">
<style>
  .fonte-n { color: var(--muted-dark); border-top: 1px solid rgba(245,246,250,.18); padding-top: 22px; }
  .fonte-c { color: var(--muted-light); border-top: 1px solid rgba(30,39,46,.14); padding-top: 22px; }
  .fonte-b { color: #FFFFFF; opacity: .9; border-top: 1px solid rgba(255,255,255,.28); padding-top: 22px; }
  .fonte-n, .fonte-c, .fonte-b { font-size: 24px; }
  .ponto { color: var(--blue); }
  .marcador { display: inline-block; width: 22px; height: 22px; border-radius: 4px; background: var(--night); margin-right: 16px; vertical-align: -2px; }
  .topo { margin-top: 130px; }
  @media (min-height: 1700px) { .grafico { margin-top: 96px !important; } }  /* área segura do Reels: marca/base.css */

  .titulo { font-size: 76px; margin-top: 64px; max-width: 904px; }
  .apoio { color: var(--muted-dark); margin-top: 20px; max-width: 860px; font-size: 30px; }
  .grafico { margin-top: 56px; display: flex; flex-direction: column; gap: 26px; }
  .linha { display: grid; grid-template-columns: 360px 1fr 110px; align-items: center; gap: 20px; }
  .rotulo { font-size: 28px; color: var(--cloud); }
  .trilho { height: 44px; position: relative; }
  .barra { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: #46535E; min-width: 4px; }
  .barra.destaque { background: var(--cyan); }
  .valor { font: 500 32px "Geist Mono", monospace; color: var(--muted-dark); text-align: right; font-variant-numeric: tabular-nums; }
  .valor.destaque { color: var(--cyan); }</style></head>
<body><div class="peca night">
  <img class="logo" src="marca/logos/mentor-logo-escuro.svg" alt="Mentor" data-in="0">
  <div class="display titulo" data-in="0.3">Finanças logo atrás dos arquivos</div>
  <p class="apoio" data-in="0.7">Pagaram por serviço em nuvem, % das empresas com acesso à internet, 2025</p>
  <div class="grafico">
    <div class="linha" data-in="1.0"><span class="rotulo">E-mail</span><div class="trilho"><div class="barra" style="width:100.0%" data-growx="1.1"></div></div><span class="valor" data-in="1.1" data-count="56" data-decimals="0" data-suffix="%">56%</span></div>
    <div class="linha" data-in="1.2"><span class="rotulo">Arquivos e dados</span><div class="trilho"><div class="barra" style="width:96.4%" data-growx="1.3"></div></div><span class="valor" data-in="1.3" data-count="54" data-decimals="0" data-suffix="%">54%</span></div>
    <div class="linha" data-in="1.4"><span class="rotulo">Finanças ou contabilidade</span><div class="trilho"><div class="barra destaque" style="width:91.1%" data-growx="1.5"></div></div><span class="valor destaque" data-in="1.5" data-count="51" data-decimals="0" data-suffix="%">51%</span></div>
    <div class="linha" data-in="1.6"><span class="rotulo">Processamento</span><div class="trilho"><div class="barra" style="width:64.3%" data-growx="1.7"></div></div><span class="valor" data-in="1.7" data-count="36" data-decimals="0" data-suffix="%">36%</span></div>
  </div>
  <div class="spacer"></div>
  <p class="fonte-n" data-in="2.2">Fonte: Cetic.br/NIC.br, Pesquisa TIC Empresas 2025</p>
</div></body></html>

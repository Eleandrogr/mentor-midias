<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/reel.css"><style>.conta{margin-top:44px;display:flex;flex-direction:column;gap:22px}
.linha{display:flex;justify-content:space-between;align-items:baseline;font-size:44px;border-bottom:2px solid rgba(245,246,250,.16);padding-bottom:14px}
.linha b{font-weight:500}
.linha.total{font-size:52px;border:0;color:var(--cyan);font-weight:600}
.bars{margin-top:40px;display:flex;flex-direction:column;gap:24px}
.r .lb{display:flex;justify-content:space-between;font-size:38px;margin-bottom:10px}
.r .b{height:72px;border-radius:12px;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
.r .b i{position:absolute;inset:0 auto 0 0;border-radius:12px;background:rgba(255,255,255,.55)}
.r.d .b i{background:var(--night)}
.ck{display:flex;flex-direction:column;gap:30px;margin-top:44px}.it{display:grid;grid-template-columns:72px 1fr;gap:24px;align-items:center;font-size:46px;line-height:1.2}
.ck .n{width:72px;height:72px;border-radius:14px;background:var(--blue);color:#fff;font:800 40px "Saira";display:flex;align-items:center;justify-content:center}
.grp{font-size:34px;margin-top:30px;color:rgba(255,255,255,.92)}</style></head><body><section class="cena night" data-dur="5.5" data-camera="aproxima"><div class="camera" style="justify-content:space-between">
  <img class="logo" src="marca/logos/mentor-logo-escuro.svg" data-in="-1" style="align-self:flex-start">
  <div>
    <div class="t2" style="font-size:90px" data-palavras data-in="-1.4" data-ritmo="0.08">Ticket médio: quanto cada venda deixa</div>
    <div class="conta mono">
      <div class="linha" data-in="-0.4" data-from="left"><span>Faturamento da semana</span><b>R$ 5.000</b></div>
      <div class="linha" data-in="0.3" data-from="left"><span>÷ Número de vendas</span><b>100</b></div>
      <div class="linha total" data-in="1.0" data-from="left" data-pulsa="1.8" data-som="impacto"><span>Ticket médio</span><b>R$ 50</b></div>
    </div>
    <p class="ap" style="font-size:40px;margin-top:26px" data-in="1.8">Na prática: faça a conta de cada semana.</p>
  </div>
  <p class="fn" style="margin:0" data-in="2.3">Valores de exemplo. Conta: faturamento ÷ número de vendas.</p>
</div></section></body></html>

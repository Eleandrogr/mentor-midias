<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/reel.css">
<style>
  .cena .camera { padding: 250px 88px 340px 88px; justify-content: space-between; }
  .rot { color: #fff; }
  .q { font-family: "Saira", sans-serif; font-weight: 800; text-transform: uppercase; font-size: 104px; line-height: .98; margin-top: 28px; }
  .dado { display: flex; align-items: baseline; gap: 28px; margin-top: 56px; }
  .dado b { font-family: "Saira", sans-serif; font-weight: 800; font-size: 180px; line-height: .85; color: var(--night); }
  .dado span { font-size: 46px; line-height: 1.25; }
  .resp { border: 3px solid rgba(255,255,255,.55); color: #fff; border-radius: 28px; padding: 44px 48px; }
  .resp .p { font-size: 48px; font-weight: 600; }
  .resp .k { font-family: "Saira", sans-serif; font-weight: 800; font-size: 170px; line-height: .9; color: #fff; margin: 10px 0 6px; }
  .resp .s { font-size: 40px; line-height: 1.3; color: rgba(255,255,255,.88); }
</style></head><body>
<section class="cena blue"><div class="camera">
  <img class="logo" src="marca/logos/mentor-logo-sobre-azul.svg" style="height:64px;align-self:flex-start;margin-bottom:40px">
  <div>
    <div class="rot"><span class="marcador acc-bg"></span>Pergunta do dia</div>
    <div class="q">Você paga conta da empresa pelo seu Pix?</div>
    <div class="dado"><b>61%</b><span>dos donos de pequenos negócios fazem isso.</span></div>
    <p class="fn" style="margin-top:28px;color:rgba(255,255,255,.88)">Fonte: Sebrae, Hábitos Financeiros dos Pequenos Negócios (2025)</p>
  </div>
  <div class="resp">
    <div class="p">Responda este story com</div>
    <div class="k">CONTA</div>
    <div class="s">e eu te mando o checklist para separar o dinheiro da casa e da empresa.</div>
  </div>
</div></section>
</body></html>

<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/reel.css">
<style>.g{display:flex;flex-direction:column;gap:22px;margin-top:48px}.l{display:grid;grid-template-columns:330px 1fr 110px;align-items:center;gap:18px;font-size:36px}
.tr{height:60px;position:relative}.tr i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:rgba(255,255,255,.45)}.tr i.d{background:var(--night)}
.v{font-family:"Geist Mono";font-size:40px;text-align:right}</style></head><body>
<section class="cena blue" data-dur="6" data-camera="aproxima"><div class="camera" style="justify-content:space-between">
  <img class="logo" src="marca/logos/mentor-logo-sobre-azul.svg" data-in="-1" style="align-self:flex-start">
  <div>
    <div class="t2" style="font-size:96px" data-palavras data-in="-0.35" data-ritmo="0.1">Como o dono controla o dinheiro</div>
    <div class="g">
      <div class="l" data-in="0.7"><span>Planilha</span><div class="tr"><i style="width:100%" data-growx="0.8"></i></div><span class="v">30%</span></div>
      <div class="l" data-in="0.9"><span>Caderno</span><div class="tr"><i style="width:83.3%" data-growx="1.0"></i></div><span class="v">25%</span></div>
      <div class="l" data-in="1.1"><span>App ou sistema</span><div class="tr"><i class="d" style="width:66.7%" data-growx="1.2" data-pulsa="2.6"></i></div><span class="v" style="font-weight:500">20%</span></div>
      <div class="l" data-in="1.3"><span>Só o contador</span><div class="tr"><i style="width:43.3%" data-growx="1.4"></i></div><span class="v">13%</span></div>
      <div class="l" data-in="1.5"><span>Nenhum controle</span><div class="tr"><i style="width:33.3%" data-growx="1.6"></i></div><span class="v">10%</span></div>
    </div>
    <p class="ap" style="font-size:40px" data-in="2.4"><b>Na prática:</b> planilha e caderno não avisam quando o dinheiro da casa entra no caixa da empresa.</p>
  </div>
  <p class="fn" style="margin:0" data-in="2.0">Fonte: Sebrae, Hábitos Financeiros dos Pequenos Negócios (2025)</p>
</div></section></body></html>

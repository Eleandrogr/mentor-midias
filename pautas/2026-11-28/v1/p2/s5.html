<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/reel.css"><style>.dias{margin-top:46px;display:grid;grid-template-columns:repeat(7,1fr);gap:14px}
.dias .d{height:118px;border-radius:16px;background:rgba(245,246,250,.08);border:2px solid rgba(245,246,250,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 54px "Saira";color:#F5F6FA}
.dias .d small{font:600 24px "Geist";color:#A3AFB8;text-transform:uppercase;letter-spacing:.06em}
.dias .d.on{background:var(--cyan);border-color:var(--cyan);color:var(--night)}
.dias .d.on small{color:var(--night)}
.leg2{margin-top:30px;display:flex;flex-direction:column;gap:16px;font-size:40px;line-height:1.2}
.leg2 span b{color:var(--cyan);font-weight:600}
.cards{margin-top:44px;display:flex;flex-direction:column;gap:24px}
.cards .o{border-radius:22px;padding:24px 30px;font-size:44px;line-height:1.2;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3)}
.cards .o.d{background:rgba(30,39,46,.85);border-color:var(--night)}
.cards .o small{display:block;font:600 28px "Geist Mono",monospace;text-transform:uppercase;margin-bottom:8px;opacity:.9}
.ck{display:flex;flex-direction:column;gap:22px;margin-top:36px}.it{display:grid;grid-template-columns:72px 1fr;gap:24px;align-items:start;font-size:42px;line-height:1.2}
.ck .n{width:72px;height:72px;border-radius:14px;background:var(--blue);color:#fff;font:800 40px "Saira";display:flex;align-items:center;justify-content:center}
.it small{display:block;font-size:34px;color:var(--muted-light);margin-top:6px}
.cta{font-family:"Saira",sans-serif;font-weight:800;line-height:.9;color:var(--night)}</style></head><body><section class="cena blue"><div class="camera">
  <img src="marca/logos/mentor-logo-sobre-azul.svg" style="height:96px;align-self:flex-start">
  <div class="fala" style="font-size:96px;margin-top:56px">Comente</div>
  <div class="cta" style="font-size:180px">ONLINE</div>
  <div class="fala" style="font-size:64px;margin-top:24px">que eu te mando o checklist da desistência na venda online.</div>
</div></section></body></html>

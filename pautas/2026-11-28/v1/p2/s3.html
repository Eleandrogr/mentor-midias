<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/reel.css"><style>.dias{margin-top:46px;display:grid;grid-template-columns:repeat(7,1fr);gap:14px}

.dias .d small{font:600 24px "Geist";color:#A3AFB8;text-transform:uppercase;letter-spacing:.06em}
.dias .d.on{background:var(--cyan);border-color:var(--cyan);color:var(--night)}

.cards .o small{display:block;font:600 28px "Geist Mono",monospace;text-transform:uppercase;margin-bottom:8px;opacity:.9}
.ck{display:flex;flex-direction:column;gap:22px;margin-top:36px}.it{display:grid;grid-template-columns:72px 1fr;gap:24px;align-items:start;font-size:42px;line-height:1.2}
.ck .n{width:72px;height:72px;border-radius:14px;background:var(--blue);color:#fff;font:800 40px "Saira";display:flex;align-items:center;justify-content:center}
.it small{display:block;font-size:34px;color:var(--muted-light);margin-top:6px}
.cta{font-family:"Saira",sans-serif;font-weight:800;line-height:.9;color:var(--night)}</style></head><body><section class="cena blue" data-dur="5.5" data-camera="aproxima"><div class="quadrado livre" style="width:420px;height:420px;right:-180px;top:900px;background:rgba(30,39,46,.12)" data-flutua></div><div class="camera" style="justify-content:space-between">

</div></section></body></html>

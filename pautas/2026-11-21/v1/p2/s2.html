<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/reel.css">
<style>
.conta{margin-top:44px;display:flex;flex-direction:column;gap:22px}
.linha{display:flex;justify-content:space-between;align-items:baseline;font-size:44px;border-bottom:2px solid rgba(245,246,250,.16);padding-bottom:14px}
.linha b{font-weight:500}
.linha.total{font-size:52px;border:0;color:var(--cyan);font-weight:600}
</style></head><body>
<section class="cena night" data-dur="5.5" data-camera="aproxima"><div class="camera" style="justify-content:space-between">
  <img class="logo" src="marca/logos/mentor-logo-escuro.svg" data-in="-1" style="align-self:flex-start">
  <div>
    <div class="t2" style="font-size:90px" data-palavras data-in="-1.4" data-ritmo="0.08">Quando pedir? Faça esta conta</div>
    <div class="conta mono">
      <div class="linha" data-in="-0.4" data-from="left"><span>Venda por dia</span><b>10 un</b></div>
      <div class="linha" data-in="0.3" data-from="left"><span>× Prazo do fornecedor</span><b>12 dias</b></div>
      <div class="linha" data-in="0.9" data-from="left"><span>+ Estoque de segurança</span><b>30 un</b></div>
      <div class="linha total" data-in="1.6" data-from="left" data-pulsa="2.3" data-som="impacto"><span>Pedir ao chegar em</span><b>150 un</b></div>
    </div>
    <p class="ap" style="font-size:40px;margin-top:26px" data-in="2.2">Na prática: faça a conta do que mais vende.</p>
  </div>
  <p class="fn" style="margin:0" data-in="2.5">Valores de exemplo. Conta: venda por dia × prazo + segurança.</p>
</div></section></body></html>

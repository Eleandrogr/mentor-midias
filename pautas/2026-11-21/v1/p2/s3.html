<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/reel.css">
<style>
.mud{display:flex;flex-direction:column;gap:22px;margin-top:40px}
.mi{display:flex;justify-content:space-between;align-items:baseline;font-size:42px;border-bottom:2px solid rgba(255,255,255,.25);padding-bottom:12px}
.mi b{font-weight:600}
.bars{margin-top:40px;display:flex;flex-direction:column;gap:24px}
.r .lb{display:flex;justify-content:space-between;font-size:38px;margin-bottom:10px}
.r .b{height:76px;border-radius:12px;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
.r .b i{position:absolute;inset:0 auto 0 0;border-radius:12px;background:rgba(255,255,255,.55)}
.r.d .b i{background:var(--night)}
</style></head><body>
<section class="cena blue" data-dur="5.5" data-camera="aproxima"><div class="camera" style="justify-content:space-between">
  <img class="logo" src="marca/logos/mentor-logo-sobre-azul.svg" data-in="-1" style="align-self:flex-start">
  <div>
    <div class="t2" style="font-size:90px" data-palavras data-in="-1.2" data-ritmo="0.1">No fim de ano, refaça a conta</div>
    <div class="mud mono">
      <div class="mi" data-in="-0.5" data-from="left"><span>Venda por dia</span><b>10 → 16 un</b></div>
      <div class="mi" data-in="-0.1" data-from="left"><span>Prazo do fornecedor</span><b>12 → 18 dias</b></div>
    </div>
    <div class="bars mono">
      <div class="r" data-in="0.5"><div class="lb"><span>Ponto de pedido normal</span><span>150 un</span></div><div class="b"><i style="width:47%" data-growx="0.6" data-dur="0.8"></i></div></div>
      <div class="r d" data-in="1.1"><div class="lb"><span>Ponto de pedido no fim de ano</span><span>318 un</span></div><div class="b"><i style="width:100%" data-growx="1.2" data-dur="0.9" data-pulsa="2.2" data-som="impacto"></i></div></div>
    </div>
  </div>
  <p class="fn" style="margin:0;color:rgba(255,255,255,.88)" data-in="2.0">Valores de exemplo: 16 × 18 + 30 = 318.</p>
</div></section></body></html>

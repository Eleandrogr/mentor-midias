<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/reel.css">
<style>
  .cena .camera { padding: 250px 88px 340px 88px; justify-content: space-between; }
  .rot { color: #fff; }
  .q { font-family: "Saira", sans-serif; font-weight: 800; text-transform: uppercase; font-size: 96px; line-height: .98; margin-top: 24px; }
  .conta { margin-top: 40px; display: flex; flex-direction: column; gap: 14px; font-size: 42px; }
  .conta .l { display: flex; align-items: center; gap: 20px; }
  .conta .b { height: 46px; border-radius: 10px; background: rgba(255,255,255,.30); }
  .conta .l.fim .b { background: var(--night); }
  .conta .l.fim span { font-weight: 700; }
  .resp { border: 3px solid rgba(255,255,255,.55); border-radius: 28px; padding: 32px 44px; }
  .resp .p { font-size: 46px; font-weight: 600; }
  .resp .k { font-family: "Saira", sans-serif; font-weight: 800; font-size: 128px; line-height: .9; margin: 8px 0 6px; }
  .resp .s { font-size: 40px; line-height: 1.3; color: rgba(255,255,255,.9); }
</style></head><body>
<section class="cena blue"><div class="camera">
  <img class="logo" src="marca/logos/mentor-logo-sobre-azul.svg" style="height:64px;align-self:flex-start;margin-bottom:32px">
  <div>
    <div class="rot"><span class="marcador acc-bg"></span>Pergunta do dia</div>
    <div class="q">Quanto você pode retirar da empresa este mês?</div>
    <div class="conta">
      <div class="l"><div class="b" style="width:560px"></div><span>Lucro do mês</span></div>
      <div class="l"><div class="b" style="width:420px"></div><span>− impostos</span></div>
      <div class="l"><div class="b" style="width:330px"></div><span>− reserva</span></div>
      <div class="l fim"><div class="b" style="width:260px"></div><span>= sua retirada</span></div>
    </div>
  </div>
  <div class="resp">
    <div class="p">Saldo na conta não é lucro. Responda com</div>
    <div class="k">RETIRADA</div>
    <div class="s">e eu te mando a conta pronta.</div>
  </div>
</div></section>
</body></html>

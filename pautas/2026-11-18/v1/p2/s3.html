<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/reel.css">
<style>.g{display:flex;flex-direction:column;gap:30px;margin-top:48px}.gl{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center}
.gl .d{font:800 54px "Saira";line-height:1}.tr{height:62px;position:relative}.tr i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:rgba(255,255,255,.4)}
.tr i.x{background:var(--night)}.tr span{position:absolute;top:50%;transform:translateY(-50%);font-size:38px;white-space:nowrap}</style></head><body>
<section class="cena blue" data-dur="6" data-camera="aproxima"><div class="camera" style="justify-content:space-between">
  <img class="logo" src="marca/logos/mentor-logo-sobre-azul.svg" data-in="-1" style="align-self:flex-start">
  <div>
    <div class="t2" style="font-size:92px" data-palavras data-in="-1.2" data-ritmo="0.1">Quanto vender a mais</div>
    <p class="ap" style="font-size:40px;margin-top:16px" data-in="-0.2">Margem de 30%, para sobrar o mesmo valor.</p>
    <div class="g mono">
      <div class="gl" data-in="-0.4"><span class="d">−5%</span><div class="tr"><i style="width:8%" data-growx="0.05"></i><span style="left:calc(8% + 18px)">+20%</span></div></div>
      <div class="gl" data-in="0.3"><span class="d">−10%</span><div class="tr"><i class="x" style="width:20%" data-growx="0.4"></i><span style="left:calc(20% + 18px)">+50%</span></div></div>
      <div class="gl" data-in="1.3"><span class="d">−15%</span><div class="tr"><i style="width:40%" data-growx="1.4"></i><span style="left:calc(40% + 18px)">+100%</span></div></div>
      <div class="gl" data-in="1.8"><span class="d">−20%</span><div class="tr"><i style="width:80%" data-growx="1.9" data-pulsa="2.8"></i><span style="left:calc(80% - 150px);color:var(--night)">+200%</span></div></div>
    </div>
    <p class="ap" style="font-size:40px" data-in="2.6">Na prática: pergunte se o volume sobe tudo isso.</p>
  </div>
  <p class="fn" style="margin:0;color:rgba(255,255,255,.88)" data-in="2.4">Exemplo. Conta: margem ÷ (margem − desconto) − 1.</p>
</div></section></body></html>

<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/reel.css">
<style>.tab{margin-top:44px;display:flex;flex-direction:column;gap:22px;font-size:40px}
.tl{display:grid;grid-template-columns:1fr 200px 200px;gap:10px;align-items:baseline;border-bottom:2px solid rgba(245,246,250,.12);padding-bottom:14px}
.tl.h{font-size:30px;color:var(--muted-dark);border:0;padding:0}.tl b{font-weight:500;text-align:right}.tl.tot{font-size:46px;border:0}
.res{margin-top:40px;display:flex;align-items:baseline;gap:24px}.res .h{font:800 150px "Saira";line-height:.9}.res span{font-size:42px;line-height:1.25}</style></head><body>
<section class="cena night" data-dur="6" data-camera="aproxima"><div class="camera" style="justify-content:space-between">
  <img class="logo" src="marca/logos/mentor-logo-escuro.svg" data-in="-1" style="align-self:flex-start">
  <div>
    <div class="t2" style="font-size:92px" data-palavras data-in="-1.4" data-ritmo="0.1">10% de desconto numa margem de 30%</div>
    <div class="tab mono">
      <div class="tl h" data-in="-0.3"><span></span><b>sem</b><b>com</b></div>
      <div class="tl" data-in="-0.3" data-from="left"><span>Preço</span><b>R$ 100</b><b>R$ 90</b></div>
      <div class="tl" data-in="-0.1" data-from="left"><span>Custo</span><b>R$ 70</b><b>R$ 70</b></div>
      <div class="tl tot" data-in="0.5" data-from="left"><span>Sobra</span><b>R$ 30</b><b class="acc">R$ 20</b></div>
    </div>
    <div class="res" data-in="1.2"><span class="h acc" data-count="50" data-prefix="+" data-suffix="%" data-pulsa="2.2">+50%</span><span>de vendas para<br>sobrar o mesmo</span></div>
  </div>
  <p class="fn" style="margin:0" data-in="2.2">Valores de exemplo. Margem = preço menos custo, sobre o preço.</p>
</div></section></body></html>

<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/base.css">
<style>
  .fonte-n { color: var(--muted-dark); border-top: 1px solid rgba(245,246,250,.18); padding-top: 22px; }
  .fonte-c { color: var(--muted-light); border-top: 1px solid rgba(30,39,46,.14); padding-top: 22px; }
  .fonte-b { color: #FFFFFF; opacity: .9; border-top: 1px solid rgba(255,255,255,.28); padding-top: 22px; }
  .fonte-n, .fonte-c, .fonte-b { font-size: 24px; }
  .ponto { color: var(--blue); }
  .marcador { display: inline-block; width: 22px; height: 22px; border-radius: 4px; background: var(--night); margin-right: 16px; vertical-align: -2px; }
  .topo { margin-top: 130px; }
  @media (min-height: 1700px) { .topo { margin-top: 330px; } .grafico { margin-top: 96px !important; } }

  .titulo { font-size: 76px; margin-top: 64px; max-width: 904px; }
  .apoio { color: var(--muted-light); margin-top: 20px; max-width: 860px; font-size: 30px; }
  .grafico { margin-top: 56px; display: flex; flex-direction: column; gap: 26px; }
  .linha { display: grid; grid-template-columns: 300px 1fr 110px; align-items: center; gap: 20px; }
  .rotulo { font-size: 28px; color: var(--night); }
  .trilho { height: 44px; position: relative; }
  .barra { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: #C5CBD3; min-width: 4px; }
  .barra.destaque { background: var(--blue); }
  .valor { font: 500 32px "Geist Mono", monospace; color: var(--muted-light); text-align: right; font-variant-numeric: tabular-nums; }
  .valor.destaque { color: var(--night); }</style></head>
<body><div class="peca cloud">
  <img class="logo" src="marca/logos/mentor-logo-claro.svg" alt="Mentor" data-in="0">
  <div class="display titulo" data-in="0.3">Onde está o seu custo</div>
  <p class="apoio" data-in="0.7">Custos operacionais em % do faturamento mensal, % das empresas, jul/2026</p>
  <div class="grafico">
    <div class="linha" data-in="1.0"><span class="rotulo">Menos de 30%</span><div class="trilho"><div class="barra" style="width:56.4%" data-growx="1.1"></div></div><span class="valor" data-in="1.1" data-count="22" data-decimals="0" data-suffix="%">22%</span></div>
    <div class="linha" data-in="1.2"><span class="rotulo">30% a 50%</span><div class="trilho"><div class="barra destaque" style="width:100.0%" data-growx="1.3"></div></div><span class="valor destaque" data-in="1.3" data-count="39" data-decimals="0" data-suffix="%">39%</span></div>
    <div class="linha" data-in="1.4"><span class="rotulo">51% a 70%</span><div class="trilho"><div class="barra" style="width:64.1%" data-growx="1.5"></div></div><span class="valor" data-in="1.5" data-count="25" data-decimals="0" data-suffix="%">25%</span></div>
    <div class="linha" data-in="1.6"><span class="rotulo">Acima de 70%</span><div class="trilho"><div class="barra" style="width:20.5%" data-growx="1.7"></div></div><span class="valor" data-in="1.7" data-count="8" data-decimals="0" data-suffix="%">8%</span></div>
    <div class="linha" data-in="1.8"><span class="rotulo">Não sabe</span><div class="trilho"><div class="barra" style="width:15.4%" data-growx="1.9"></div></div><span class="valor" data-in="1.9" data-count="6" data-decimals="0" data-suffix="%">6%</span></div>
  </div>
  <div class="spacer"></div>
  <p class="fonte-c" data-in="2.4">Fonte: Sebrae RS, Monitoramento dos Pequenos Negócios (jul/2026)</p>
</div></body></html>

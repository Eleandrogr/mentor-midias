<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/base.css">
<style>
  .fonte-n { color: var(--muted-dark); border-top: 1px solid rgba(245,246,250,.18); padding-top: 22px; }
  .fonte-c { color: var(--muted-light); border-top: 1px solid rgba(30,39,46,.14); padding-top: 22px; }
  .fonte-b { color: #FFFFFF; opacity: .9; border-top: 1px solid rgba(255,255,255,.28); padding-top: 22px; }
  .fonte-n, .fonte-c, .fonte-b { font-size: 24px; }
  .ponto { color: var(--blue); }
  .marcador { display: inline-block; width: 22px; height: 22px; border-radius: 4px; background: var(--night); margin-right: 16px; vertical-align: -2px; }
  .topo { margin-top: 130px; }
  @media (min-height: 1700px) { .topo { margin-top: 330px; } .grafico { margin-top: 96px !important; } }

  .titulo { font-size: 76px; margin-top: 64px; max-width: 904px; }
  .apoio { color: var(--muted-dark); margin-top: 20px; max-width: 860px; font-size: 30px; }
  .grafico { margin-top: 56px; display: flex; flex-direction: column; gap: 26px; }
  .linha { display: grid; grid-template-columns: 280px 1fr 130px; align-items: center; gap: 20px; }
  .rotulo { font-size: 28px; color: var(--cloud); }
  .trilho { height: 44px; position: relative; }
  .barra { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: #46535E; min-width: 4px; }
  .barra.destaque { background: var(--cyan); }
  .valor { font: 500 32px "Geist Mono", monospace; color: var(--muted-dark); text-align: right; font-variant-numeric: tabular-nums; }
  .valor.destaque { color: var(--cyan); }</style></head>
<body><div class="peca night">
  <img class="logo" src="marca/logos/mentor-logo-escuro.svg" alt="Mentor" data-in="0">
  <div class="display titulo" data-in="0.3">Serviços são mais da metade</div>
  <p class="apoio" data-in="0.7">Empresas inadimplentes por setor, % do total, agosto de 2026</p>
  <div class="grafico">
    <div class="linha" data-in="1.0"><span class="rotulo">Serviços</span><div class="trilho"><div class="barra destaque" style="width:100.0%" data-growx="1.1"></div></div><span class="valor destaque" data-in="1.1" data-count="56.0" data-decimals="1" data-suffix="%">56,0%</span></div>
    <div class="linha" data-in="1.2"><span class="rotulo">Comércio</span><div class="trilho"><div class="barra" style="width:57.1%" data-growx="1.3"></div></div><span class="valor" data-in="1.3" data-count="32.0" data-decimals="1" data-suffix="%">32,0%</span></div>
    <div class="linha" data-in="1.4"><span class="rotulo">Indústria</span><div class="trilho"><div class="barra" style="width:14.3%" data-growx="1.5"></div></div><span class="valor" data-in="1.5" data-count="8.0" data-decimals="1" data-suffix="%">8,0%</span></div>
    <div class="linha" data-in="1.6"><span class="rotulo">Primário</span><div class="trilho"><div class="barra" style="width:1.6%" data-growx="1.7"></div></div><span class="valor" data-in="1.7" data-count="0.9" data-decimals="1" data-suffix="%">0,9%</span></div>
  </div>
  <div class="spacer"></div>
  <p class="fonte-n" data-in="2.2">Fonte: Serasa Experian, Indicador de Inadimplência das Empresas (ago/2026)</p>
</div></body></html>

<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/reel.css"><style>.cmp{margin-top:44px;display:flex;flex-direction:column;gap:26px}
.cx{border-radius:22px;padding:26px 30px;font-size:42px;line-height:1.2}
.cx small{display:block;font:600 30px "Geist Mono",monospace;opacity:.8;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.night .cx.a{background:rgba(245,246,250,.08);border:2px solid rgba(245,246,250,.2)}
.night .cx.b{background:rgba(0,206,201,.12);border:2px solid var(--cyan)}
.night .cx.b small{color:var(--cyan);opacity:1}
.tl{margin-top:40px;position:relative}
.dias{display:flex;justify-content:space-between;font:600 32px "Geist Mono",monospace;color:rgba(255,255,255,.9);margin-bottom:12px}
.trilho{height:72px;border-radius:14px;background:rgba(255,255,255,.18);position:relative;overflow:visible}
.trilho i{position:absolute;top:0;bottom:0;left:0;border-radius:14px;background:var(--night)}
.natal{position:absolute;top:-16px;bottom:-16px;width:6px;background:#fff;border-radius:3px}
.leg{display:flex;justify-content:space-between;font-size:34px;margin-top:20px}
.op{margin-top:50px;display:flex;flex-direction:column;gap:30px}
.op div{font-size:46px;line-height:1.2;padding-left:30px;border-left:6px solid var(--night)}</style></head><body><section class="cena blue" data-dur="5.5" data-camera="aproxima"><div class="quadrado livre" style="width:420px;height:420px;right:-180px;top:900px;background:rgba(30,39,46,.12)" data-flutua></div><div class="camera" style="justify-content:space-between">
  <img class="logo" src="marca/logos/mentor-logo-sobre-azul.svg" data-in="-1" style="align-self:flex-start">
  <div>
    <div class="t2" style="font-size:90px" data-palavras data-in="-1.4" data-ritmo="0.08">Chegou depois do Natal? Dá para recusar</div>
    <div class="tl" data-in="-0.5">
      <div class="dias" style="position:relative;height:40px"><span style="position:absolute;left:0">1/12</span><span style="position:absolute;left:77%;transform:translateX(-50%);white-space:nowrap">Natal 25/12</span></div>
      <div class="trilho"><i style="width:87%" data-growx="0.1" data-dur="0.9" data-som="impacto"></i><span class="natal" style="left:77%"></span></div>
      <div class="leg" style="justify-content:flex-end"><span>Entrega: 28/12 (exemplo)</span></div>
    </div>
    <div class="op">
      <div data-in="0.7" data-from="left">Não serve mais? Recuso e peço perdas e danos.</div>
      <div data-in="1.5" data-from="left" data-pulsa="2.6">Multa combinada? Cobro junto, até o valor do pedido.</div>
    </div>
  </div>
  <p class="fn" style="margin:0;color:rgba(255,255,255,.92)" data-in="2.2">Fonte: Código Civil, arts. 395, 411 e 412.</p>
</div></section></body></html>

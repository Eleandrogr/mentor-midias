<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/reel.css"><style>.cmp{margin-top:44px;display:flex;flex-direction:column;gap:26px}
.cx{border-radius:22px;padding:26px 30px;font-size:42px;line-height:1.2}
.cx small{display:block;font:600 30px "Geist Mono",monospace;opacity:.8;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.night .cx.a{background:rgba(245,246,250,.08);border:2px solid rgba(245,246,250,.2)}
.night .cx.b{background:rgba(0,206,201,.12);border:2px solid var(--cyan)}
.night .cx.b small{color:var(--cyan);opacity:1}
.tl{margin-top:40px;position:relative}
.dias{display:flex;justify-content:space-between;font:600 32px "Geist Mono",monospace;color:rgba(255,255,255,.9);margin-bottom:12px}
.trilho{height:72px;border-radius:14px;background:rgba(255,255,255,.18);position:relative;overflow:visible}
.trilho i{position:absolute;top:0;bottom:0;left:0;border-radius:14px;background:var(--night)}
.natal{position:absolute;top:-16px;bottom:-16px;width:6px;background:#fff;border-radius:3px}
.leg{display:flex;justify-content:space-between;font-size:34px;margin-top:20px}
.op{margin-top:34px;display:flex;flex-direction:column;gap:18px}
.op div{font-size:40px;line-height:1.2;padding-left:30px;border-left:6px solid var(--night)}</style></head><body><section class="cena night" data-dur="5.5" data-camera="aproxima"><div class="camera" style="justify-content:space-between">
  <img class="logo" src="marca/logos/mentor-logo-escuro.svg" data-in="-1" style="align-self:flex-start">
  <div>
    <div class="t2" style="font-size:90px" data-palavras data-in="-1.4" data-ritmo="0.08">Sem data escrita, o atraso nem começa</div>
    <div class="cmp">
      <div class="cx a" data-in="-0.4" data-from="left"><small>Pedido sem data</small>Só fica em atraso depois que eu cobro por escrito.</div>
      <div class="cx b" data-in="0.8" data-from="left" data-pulsa="1.8" data-som="impacto"><small>Pedido com data</small>Passou do dia, está em atraso. Sem precisar cobrar.</div>
    </div>
    <p class="ap" style="font-size:40px;margin-top:26px" data-in="2.4">Na prática: todo pedido sai com o dia da entrega.</p>
  </div>
  <p class="fn" style="margin:0" data-in="2.8">Fonte: Código Civil, art. 397 e parágrafo único.</p>
</div></section></body></html>

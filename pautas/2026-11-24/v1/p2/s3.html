<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/reel.css"><style>.conta{margin-top:44px;display:flex;flex-direction:column;gap:22px}
.linha{display:flex;justify-content:space-between;align-items:baseline;font-size:44px;border-bottom:2px solid rgba(245,246,250,.16);padding-bottom:14px}
.linha b{font-weight:500}
.linha.total{font-size:52px;border:0;color:var(--cyan);font-weight:600}
.tl{margin-top:44px;display:flex;flex-direction:column;gap:22px}
.et{display:grid;grid-template-columns:1fr;gap:10px}
.et .lb{display:flex;justify-content:space-between;font-size:40px}
.et .lb span:last-child{font:600 34px "Geist Mono",monospace}
.et .b{height:60px;border-radius:12px;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
.et .b i{position:absolute;inset:0 auto 0 0;border-radius:12px;background:rgba(255,255,255,.55)}
.et.t .b i{background:var(--night)}
.grp{font-size:40px;margin-top:30px;color:rgba(255,255,255,.95)}</style></head><body>
<section class="cena blue" data-dur="5.5" data-camera="aproxima"><div class="quadrado livre" style="width:420px;height:420px;right:-180px;top:880px;background:rgba(30,39,46,.12)" data-flutua></div><div class="camera" style="justify-content:space-between">
  <img class="logo" src="marca/logos/mentor-logo-sobre-azul.svg" data-in="-1" style="align-self:flex-start">
  <div>
    <div class="t2" style="font-size:90px" data-palavras data-in="-1.4" data-ritmo="0.08">Dois prazos de 12 meses</div>
    <div class="tl">
      <div class="et" data-in="-0.6"><div class="lb"><span>1º ano: ganha o direito</span><span>MAR/25 → MAR/26</span></div><div class="b"><i style="width:50%" data-growx="-0.6" data-dur="0.6"></i></div></div>
      <div class="et" data-in="0.3"><div class="lb"><span>2º ano: prazo para dar</span><span>até FEV/27</span></div><div class="b"><i style="width:100%" data-growx="0.3" data-dur="0.8"></i></div></div>
      <div class="et t" data-in="1.3"><div class="lb"><span>Depois disso</span><span data-pulsa="3.8">em dobro</span></div><div class="b"><i style="width:100%" data-growx="1.3" data-dur="0.6" data-pulsa="2.1" data-som="impacto"></i></div></div>
    </div>
    <p class="grp" data-in="2.4">Avise por escrito 30 dias antes. Pague até 2 dias antes.</p>
  </div>
  <p class="fn" style="margin:0;color:rgba(255,255,255,.9)" data-in="2.8">Datas de exemplo. Fonte: CLT, art. 134, 135 e 145.</p>
</div></section></body></html>

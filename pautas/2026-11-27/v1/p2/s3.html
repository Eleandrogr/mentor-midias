<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/reel.css"><style>.form{margin-top:44px;background:rgba(245,246,250,.08);border:2px solid rgba(245,246,250,.2);border-radius:22px;padding:30px 34px}
.form .l{font:600 44px "Geist Mono",monospace;line-height:1.25;color:#F5F6FA}
.form .l b{color:var(--cyan);font-weight:600}
.form .tr{height:4px;background:rgba(245,246,250,.5);margin:16px 0;border-radius:2px}
.leg2{margin-top:28px;display:flex;flex-direction:column;gap:14px;font-size:38px;line-height:1.2}
.leg2 span b{color:var(--cyan);font:600 36px "Geist Mono",monospace}
.bars{margin-top:44px;display:flex;flex-direction:column;gap:30px}
.r .lb{display:flex;justify-content:space-between;font-size:40px;margin-bottom:10px}
.r .lb b{font:600 44px "Geist Mono",monospace}
.r .b{height:80px;border-radius:12px;position:relative;overflow:hidden;background:rgba(30,39,46,.14)}
.r .b i{position:absolute;inset:0 auto 0 0;border-radius:12px}
.nota{margin-top:30px;font-size:40px;line-height:1.22;padding-left:30px;border-left:6px solid var(--night)}</style></head><body><section class="cena blue" data-dur="5.5" data-camera="aproxima"><div class="quadrado livre" style="width:420px;height:420px;right:-180px;top:900px;background:rgba(30,39,46,.12)" data-flutua></div><div class="camera" style="justify-content:space-between">
  <img class="logo" src="marca/logos/mentor-logo-sobre-azul.svg" data-in="-1" style="align-self:flex-start">
  <div>
    <div class="t2" style="font-size:90px" data-palavras data-in="-1.4" data-ritmo="0.08">Passou de R$ 360 mil, mudou de faixa</div>
    <div class="bars">
      <div class="r" data-in="-0.4"><div class="lb"><span>12 meses: R$ 340 mil</span><b>5,6%</b></div><div class="b"><i style="width:56%;background:rgba(255,255,255,.55)" data-growx="0" data-dur="0.6"></i></div></div>
      <div class="r" data-in="0.3"><div class="lb"><span>12 meses: R$ 380 mil</span><b style="color:var(--night)">5,9%</b></div><div class="b"><i style="width:59%;background:var(--night)" data-growx="0.5" data-dur="0.8" data-pulsa="1.6" data-som="impacto"></i></div></div>
    </div>
    <div class="nota" data-in="1.4" data-from="left">Em cada R$ 10 mil vendidos, o imposto vai de R$ 555 para R$ 585.</div>
  </div>
  <p class="fn" style="margin:0;color:rgba(255,255,255,.92)" data-in="2.2">Valores de exemplo. Fonte: LC 123/2006, Anexo I (comércio).</p>
</div></section></body></html>

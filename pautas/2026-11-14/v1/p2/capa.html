<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/base.css">
<style>
  .rotulo { font-size: 26px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-top: 96px; opacity: .9; }
  .numero { font-size: 300px; line-height: .84; margin-top: 28px; white-space: nowrap; color: #FFFFFF; }
  .titulo { font-size: 96px; margin-top: 40px; max-width: 904px; color: #FFFFFF; }
  .apoio { margin-top: 36px; max-width: 860px; color: #FFFFFF; opacity: .92; }
  .chamada { font-size: 30px; font-weight: 600; margin-bottom: 28px; display: flex; align-items: center; }
  .marcador { display: inline-block; width: 22px; height: 22px; border-radius: 4px; background: var(--night); margin-right: 16px; }
  .fonte-b { font-size: 24px; color: #FFFFFF; opacity: .9; border-top: 1px solid rgba(255,255,255,.28); padding-top: 22px; }
</style></head>
<body><div class="peca blue">
  <img class="logo" src="marca/logos/mentor-logo-sobre-azul.svg" alt="Mentor">
  <div class="rotulo">Pequenos negócios · Sebrae 2025</div>
  <div class="display numero">43%</div>
  <div class="display titulo">Cartão de crédito no caixa</div>
  <p class="apoio">dos pequenos negócios usam cartão de crédito, segundo a pesquisa Hábitos Financeiros do Sebrae.</p>
  <div class="spacer"></div>
  <div class="chamada"><span class="marcador"></span>Arraste para ver quanto custa o rotativo &rarr;</div>
  <p class="fonte-b">Fonte: Sebrae, Hábitos Financeiros dos Pequenos Negócios (2025)</p>
</div></body></html>

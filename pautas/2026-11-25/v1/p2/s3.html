<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/reel.css"><style>.conta{margin-top:44px;display:flex;flex-direction:column;gap:22px}

.linha b{font-weight:500}
.linha.total{font-size:52px;border:0;color:var(--cyan);font-weight:600}
.tl{margin-top:44px;display:flex;flex-direction:column;gap:22px}
.et{display:grid;grid-template-columns:1fr;gap:10px}
.et .lb{display:flex;justify-content:space-between;font-size:40px}
.et .lb span:last-child{font:600 34px "Geist Mono",monospace}
.et .b{height:60px;border-radius:12px;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
.et .b i{position:absolute;top:0;bottom:0;border-radius:12px;background:rgba(255,255,255,.55)}
.et.t .b i{background:var(--night)}
.grp{font-size:40px;margin-top:30px;color:rgba(255,255,255,.95)}</style></head><body><section class="cena blue" data-dur="5.5" data-camera="aproxima"><div class="quadrado livre" style="width:420px;height:420px;right:-180px;top:880px;background:rgba(30,39,46,.12)" data-flutua></div><div class="camera" style="justify-content:space-between">
  <img class="logo" src="marca/logos/mentor-logo-sobre-azul.svg" data-in="-1" style="align-self:flex-start">
  <div>
    <div class="t2" style="font-size:90px" data-palavras data-in="-1.4" data-ritmo="0.08">O buraco fica entre pagar e receber</div>
    <div class="tl">
      <div class="et" data-in="-0.6"><div class="lb"><span>Pago o fornecedor</span><span>dia 30</span></div><div class="b"><i style="left:0;width:32%" data-growx="-0.6" data-dur="0.6"></i></div></div>
      <div class="et" data-in="0.3"><div class="lb"><span>Vendo no parcelado</span><span>dia 35</span></div><div class="b"><i style="left:0;width:37%" data-growx="0.3" data-dur="0.6"></i></div></div>
      <div class="et" data-in="1.0"><div class="lb"><span>Recebo a venda</span><span>dia 95</span></div><div class="b"><i style="left:0;width:100%" data-growx="1.0" data-dur="0.8"></i></div></div>
      <div class="et t" data-in="1.9"><div class="lb"><span>Sem o dinheiro</span><span data-pulsa="3.8">65 dias</span></div><div class="b"><i style="left:32%;width:68%" data-growx="1.9" data-dur="0.6" data-pulsa="2.6" data-som="impacto"></i></div></div>
    </div>
    <p class="grp" data-in="2.8">Mais parcelas na Black Friday: o buraco cresce.</p>
  </div>
  <p class="fn" style="margin:0;color:rgba(255,255,255,.9)" data-in="3.0">Dias de exemplo. Fonte: Sebrae/PR (2020).</p>
</div></section></body></html>

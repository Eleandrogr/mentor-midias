<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/reel.css"><style>.conta{margin-top:44px;display:flex;flex-direction:column;gap:22px}
.linha{display:flex;justify-content:space-between;align-items:baseline;font-size:44px;border-bottom:2px solid rgba(245,246,250,.16);padding-bottom:14px}
.linha b{font-weight:500}
.linha.total{font-size:52px;border:0;color:var(--cyan);font-weight:600}
.tl{margin-top:44px;display:flex;flex-direction:column;gap:22px}
.et{display:grid;grid-template-columns:1fr;gap:10px}
.et .lb{display:flex;justify-content:space-between;font-size:40px}
.et .lb span:last-child{font:600 34px "Geist Mono",monospace}
.et .b{height:60px;border-radius:12px;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
.et .b i{position:absolute;top:0;bottom:0;border-radius:12px;background:rgba(255,255,255,.55)}
.et.t .b i{background:var(--night)}
.grp{font-size:40px;margin-top:30px;color:rgba(255,255,255,.95)}</style></head><body><section class="cena night" data-dur="5.5" data-camera="aproxima"><div class="camera" style="justify-content:space-between">
  <img class="logo" src="marca/logos/mentor-logo-escuro.svg" data-in="-1" style="align-self:flex-start">
  <div>
    <div class="t2" style="font-size:90px" data-palavras data-in="-1.4" data-ritmo="0.08">Quantos dias fico sem o dinheiro</div>
    <div class="conta mono">
      <div class="linha" data-in="-0.6" data-from="left"><span>Parado no estoque</span><b>35 dias</b></div>
      <div class="linha" data-in="0.0" data-from="left"><span>+ Prazo para receber</span><b>60 dias</b></div>
      <div class="linha" data-in="0.6" data-from="left"><span>− Prazo do fornecedor</span><b>30 dias</b></div>
      <div class="linha total" data-in="1.2" data-from="left" data-pulsa="2.0" data-som="impacto"><span>Sem o dinheiro</span><b>65 dias</b></div>
    </div>
    <p class="ap" style="font-size:40px;margin-top:26px" data-in="2.4">Na prática: faça esta conta hoje com os seus prazos.</p>
  </div>
  <p class="fn" style="margin:0" data-in="2.8">Dias de exemplo. Fonte: Sebrae/PR, Ciclo econômico, operacional e financeiro (2020).</p>
</div></section></body></html>

<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/base.css">

  .apoio { color: var(--muted-dark); margin-top: 36px; max-width: 820px; }

<body><div class="peca night">

<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="marca/base.css">
<style>
  .rotulo { font-size: 24px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-top: 120px; opacity: .85; }
  .titulo { font-size: 104px; margin-top: 20px; }
  .formula { margin-top: 56px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.28); border-radius: 12px; padding: 30px 34px; font-size: 32px; line-height: 1.55; }
  .formula b { font-weight: 500; }
  .apoio { margin-top: 44px; max-width: 760px; }
  .marcador { display: inline-block; width: 22px; height: 22px; border-radius: 4px; background: var(--night); margin-right: 16px; vertical-align: -2px; }
</style></head>
<body><div class="peca blue">
  <img class="logo" src="marca/logos/mentor-logo-sobre-azul.svg" alt="Mentor">
  <div class="rotulo">Indicador da semana</div>
  <div class="display titulo">Margem de<br>contribuição</div>
  <div class="formula mono">Preço de venda<br>− custos e despesas variáveis<br><b>= margem de contribuição</b></div>
  <p class="apoio"><span class="marcador"></span>É o que cada venda deixa para pagar os custos fixos. O que passar disso é lucro.</p>
</div></body></html>
